services:
  mongodb:
    image: mongo:7.0
    container_name: realestate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: realestate
    networks:
      - realestate-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: realestate-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/realestate
      - JWT_SECRET=your-secret-key-change-in-production
      - FRONTEND_URL=http://localhost:3000
      - OPENROUTER_API_KEY=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
      - OPENROUTER_MODEL=deepseek/deepseek-chat-v3.1
      - GOOGLE_CLIENT_ID=72270905022-8bu3mbnam58chjnjnbrjk747a11u0cta.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_CALLBACK_URL=http://localhost:5001/api/auth/google/callback
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - realestate-network
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: realestate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - realestate-network
    stdin_open: true
    tty: true

volumes:
  mongodb_data:

networks:
  realestate-network:
    driver: bridge

